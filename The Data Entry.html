
<!DOCTYPE html>
<html>
<head>
    <title>LiveLap Data Entry</title>
    <link rel="stylesheet" href="style.css">
    <script src="lap-time-input.js" defer></script>
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="table-skeleton.html">Leaderboard</a>
        <a href="The Data Entry.html">Results</a>
    </nav>

    <div class="container">

        <div class="header">
            <h1>DRIFT TIME TRIAL</h1>
            <h2>DATA ENTRY</h2>
        </div>

        <form id="raceForm">

            <label for="name">Driver Name</label>
            <input 
                type="text" 
                id="name" 
                placeholder="Enter driver name"
                required
            >

            <label for="time">Time</label>
            <input 
                type="text" 
                id="time" 
                placeholder="MM:SS.hh"
                inputmode="numeric"
                required
            >
            <small>Type digits only, e.g. 012345 becomes 01:23.45.</small>

            <label for="date">Date</label>
            <input 
                type="date" 
                id="date"
                required
            >

            <button type="submit">
                Add Result
            </button>

        </form>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
