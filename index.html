<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveLap Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="lap-time-input.js" defer></script>
</head>

<body class="home-page">

    <nav>
        <a href="/">Home</a>
        <a href="/leaderboard">Leaderboard</a>
        <a href="/results">Results</a>
    </nav>

    <div class="container">

        <!-- Header Section -->
        <div class="header">
            <h1>DRIFT TIME TRIAL</h1>
            <h2>{{leaderboardPeriod}}</h2>
        </div>

        <!-- Search is submitted to the server and rendered with the page. -->
        <form class="search-panel" method="get" action="/">
            <label for="searchInput">Find a driver</label>
            <input type="search" id="searchInput" name="driver" value="{{driverFilter}}" placeholder="Type a driver name..." autocomplete="off">
            <button class="search-submit" type="submit">Search</button>
        </form>

        <!-- Admin Form to Add New Times -->
        <form class="admin-panel" id="timeEntryForm" method="post" action="/times">
            <input type="hidden" name="returnTo" value="/">
            <div class="admin-panel-heading">
                <h3>Add a lap time</h3>
                <p>Enter the driver and run details below.</p>
            </div>
            <div class="admin-fields">
                <div class="input-group">
                    <label for="newName">Driver name</label>
                    <input type="text" id="newName" name="name" placeholder="e.g. Alex Rivera" autocomplete="name" required>
                    <small aria-hidden="true">&nbsp;</small>
                </div>
                <div class="input-group">
                    <label for="newTime">Lap time</label>
                    <input type="text" id="newTime" name="time" placeholder="MM:SS.hh" inputmode="numeric" autocomplete="off" required>
                    <small>Type digits only, e.g. 012345 becomes 01:23.45.</small>
                </div>
                <div class="input-group">
                    <label for="newEvent">Event name</label>
                    <input type="text" id="newEvent" name="eventName" placeholder="e.g. October Time Trial" required>
                    <small>Name this race event.</small>
                </div>
                <div class="input-group">
                    <label for="newDate">Run date</label>
                    <input type="date" id="newDate" name="date" required>
                    <small>Select the date of the run.</small>
                </div>
                <button id="addTimeBtn" type="submit">Submit time</button>
            </div>
            <p class="form-message" aria-live="polite">{{formMessage}}</p>
        </form>

        <!-- Main Leaderboard Table -->
        <table id="leaderboard">

            <thead>
                <tr>
                    <th>RANK</th>
                    <th>TIME</th>
                    <th>NAME</th>
                    <th>DATE</th>
                </tr>
            </thead>

            <tbody id="leaderboardBody">
                {{leaderboardRows}}
            </tbody>

        </table>

    </div>

</body>
</html>
