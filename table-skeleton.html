
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveLap - Drift Time Trial</title>
    <link rel="stylesheet" href="style.css">
    <script src="lap-time-input.js" defer></script>
</head>

<body class="leaderboard-page">

    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav>
        <a href="/">Home</a>
        <a href="/leaderboard">Leaderboard</a>
        <a href="/results">Results</a>
    </nav>


    <!-- =========================
         MAIN CONTAINER
    ========================== -->

    <div class="container">

        <!-- HEADER -->

        <div class="header">
            <h1>DRIFT TIME TRIAL</h1>
            <h2>{{leaderboardPeriod}}</h2>
        </div>


        <!-- =========================
             DATA ENTRY
        ========================== -->

        <section id="data-entry">

            <h2>DATA ENTRY</h2>
            <p class="entry-description">Record a driver’s lap time, event, and run date.</p>

            <form id="raceForm" method="post" action="/times">
                <input type="hidden" name="returnTo" value="/leaderboard">
                <div class="leaderboard-field">
                    <label for="name">Driver name</label>
                    <input type="text" id="name" name="name" placeholder="Enter driver name" autocomplete="name" required>
                </div>

                <div class="leaderboard-field">
                    <label for="time">Lap time</label>
                    <input type="text" id="time" name="time" placeholder="MM:SS.hh" inputmode="numeric" autocomplete="off" required>
                    <small>Type digits only, e.g. 012345 becomes 01:23.45.</small>
                </div>

                <div class="leaderboard-field">
                    <label for="event">Event name</label>
                    <input type="text" id="event" name="eventName" placeholder="e.g. October Time Trial" required>
                </div>

                <div class="leaderboard-field">
                    <label for="date">Run date</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <button type="submit">Add result</button>

            </form>

            <p id="message">{{formMessage}}</p>

        </section>


        <!-- =========================
             LEADERBOARD
        ========================== -->

        <section id="leaderboard">

            <div class="header">
                        <h2>LEADERBOARD</h2>
            </div>


            <table>

                <thead>

                    <tr>
                        <th>RANK</th>
                        <th>TIME</th>
                        <th>NAME</th>
                        <th>DATE</th>
                    </tr>

                </thead>


                <tbody id="leaderboardBody">
                    {{leaderboardRows}}
                </tbody>

            </table>

        </section>

    </div>


</body>

</html>
